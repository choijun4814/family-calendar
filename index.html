  const ev=(d,h,mi,t)=>{const a=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,mi);L.push('BEGIN:VEVENT','UID:fc'+id+++'-'+s(a)+'@famcal','DTSTAMP:'+st,'DTSTART:'+s(a),'DTEND:'+s(new Date(a.getTime()+18e5)),'SUMMARY:'+t,'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:'+t,'END:VALARM','END:VEVENT')};
  for(let i=0;i<mo*31;i++){const d=D0(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()+i),p=new Date(d.getTime()-864e5),c=sh(d);
   if(c=='D')ev(d,6,10,'데이근무 기상');if(c=='N'&&!tr[K(p)])ev(p,16,10,'나이트근무 기상');if(tr[K(d)])ev(d,14,30,'사내교육 16시까지 출근')}
